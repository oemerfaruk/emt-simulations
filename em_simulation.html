<script type="module">
import * as THREE from 'three';

// ── Mobile-Friendly custom OrbitControls with Touch Support ──────────────────
class CustomOrbitControls {
  constructor(camera, domElement) {
    this.camera = camera;
    this.domElement = domElement;
    this.enabled = true;
    this.target = new THREE.Vector3(0, 0, 0);
    this.minDistance = 3; 
    this.maxDistance = 40;
    this.enableDamping = true; 
    this.dampingFactor = 0.08;
    
    this._spherical = new THREE.Spherical();
    this._sphericalDelta = new THREE.Spherical();
    this._scale = 1;
    this._isDragging = false;
    this._mouse = { x: 0, y: 0 };
    this._touchMode = 'none'; // 'rotate', 'zoom'
    this._initialTouchDist = 0;

    this._updateSpherical();

    // Mouse Listeners
    domElement.addEventListener('mousedown', e => this._onMouseDown(e));
    window.addEventListener('mousemove', e => this._onMouseMove(e));
    window.addEventListener('mouseup', () => { this._isDragging = false; this._touchMode = 'none'; });
    domElement.addEventListener('wheel', e => this._onWheel(e), { passive: false });

    // Touch Listeners for Mobile Devices
    domElement.addEventListener('touchstart', e => this._onTouchStart(e), { passive: false });
    domElement.addEventListener('touchmove', e => this._onTouchMove(e), { passive: false });
    domElement.addEventListener('touchend', () => { this._isDragging = false; this._touchMode = 'none'; });
    
    domElement.addEventListener('contextmenu', e => e.preventDefault());
  }

  _updateSpherical() {
    const offset = this.camera.position.clone().sub(this.target);
    this._spherical.setFromVector3(offset);
  }

  _onMouseDown(e) {
    if (!this.enabled) return;
    this._isDragging = true;
    this._mouse.x = e.clientX; 
    this._mouse.y = e.clientY;
  }

  _onMouseMove(e) {
    if (!this._isDragging || !this.enabled) return;
    const dx = e.clientX - this._mouse.x;
    const dy = e.clientY - this._mouse.y;
    this._mouse.x = e.clientX; 
    this._mouse.y = e.clientY;

    this._sphericalDelta.theta -= dx * 0.005;
    this._sphericalDelta.phi -= dy * 0.005;
  }

  _onWheel(e) {
    if (!this.enabled) return;
    e.preventDefault();
    this._scale *= e.deltaY > 0 ? 1.08 : 0.92;
  }

  _onTouchStart(e) {
    if (!this.enabled) return;
    this._isDragging = true;
    if (e.touches.length === 1) {
      this._touchMode = 'rotate';
      this._mouse.x = e.touches[0].clientX;
      this._mouse.y = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      this._touchMode = 'zoom';
      this._initialTouchDist = this._getTouchDist(e);
    }
  }

  _onTouchMove(e) {
    if (!this._isDragging || !this.enabled) return;
    e.preventDefault();
    if (this._touchMode === 'rotate' && e.touches.length === 1) {
      const dx = e.touches[0].clientX - this._mouse.x;
      const dy = e.touches[0].clientY - this._mouse.y;
      this._mouse.x = e.touches[0].clientX;
      this._mouse.y = e.touches[0].clientY;

      this._sphericalDelta.theta -= dx * 0.007;
      this._sphericalDelta.phi -= dy * 0.007;
    } else if (this._touchMode === 'zoom' && e.touches.length === 2) {
      const dist = this._getTouchDist(e);
      if (dist > 0.01) {
        const factor = this._initialTouchDist / dist;
        this._initialTouchDist = dist;
        this._scale *= factor;
      }
    }
  }

  _getTouchDist(e) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  update() {
    const damp = this.enableDamping ? this.dampingFactor : 1;
    this._spherical.theta += this._sphericalDelta.theta * damp;
    this._spherical.phi   += this._sphericalDelta.phi   * damp;

    // Constrain phi inside physical bounds (not passing poles)
    this._spherical.phi = Math.max(0.05, Math.min(Math.PI - 0.05, this._spherical.phi));

    this._spherical.radius *= this._scale;
    this._spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this._spherical.radius));

    this._sphericalDelta.theta *= (1 - damp);
    this._sphericalDelta.phi   *= (1 - damp);
    this._scale = 1 + (this._scale - 1) * (1 - damp);

    const offset = new THREE.Vector3().setFromSpherical(this._spherical);
    this.camera.position.copy(this.target).add(offset);
    this.camera.lookAt(this.target);
  }
}

// ── Three.js Scene Setup ──────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x030712);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x030712, 16, 35);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7, 4, 12);

const controls = new CustomOrbitControls(camera, renderer.domElement);
controls.update();

// ── Simulation Parameters & State ─────────────────────────────────────────────
let E0x = 1.0;
let E0y = 1.0;
let deltaVal = Math.PI / 2; // In radians (default Circular)
let showE = true;
let showB = false;
let showTrail = true;
let showEnvelope = true;
let speedMult = 1.0;
let isPlaying = true;
let t = 0;

const N_ARROWS = 32;   // Number of vector nodes along the propagation path
const Z_RANGE = 10;    // Propagation length along Z axis (from -5 to +5)

// ── Coordinate Axes & Grid System ─────────────────────────────────────────────
function createAxis(dir, len, colorHex, labelText, labelPos) {
  const arrow = new THREE.ArrowHelper(dir.clone().normalize(), new THREE.Vector3(0,0,0), len, colorHex, 0.25, 0.15);
  scene.add(arrow);

  // High Resolution Sprite text label
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#' + colorHex.toString(16).padStart(6, '0');
  ctx.font = 'bold 54px Space Mono, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(labelText, 64, 64);
  
  const tex = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sprite.scale.set(0.7, 0.7, 1);
  sprite.position.copy(labelPos);
  scene.add(sprite);
}

// X-Axis (Electric field primary direction)
createAxis(new THREE.Vector3(1,0,0), 3.2, 0xff4d8f, 'X', new THREE.Vector3(3.6, 0, 0));
// Y-Axis (Electric field secondary direction)
createAxis(new THREE.Vector3(0,1,0), 3.2, 0x7fff6e, 'Y', new THREE.Vector3(0, 3.6, 0));
// Z-Axis (Propagation Vector k)
createAxis(new THREE.Vector3(0,0,1), Z_RANGE/2 + 1.2, 0x00c8ff, 'k̂ (z)', new THREE.Vector3(0, 0, Z_RANGE/2 + 1.6));
const negZ = new THREE.ArrowHelper(new THREE.Vector3(0,0,-1), new THREE.Vector3(), Z_RANGE/2 + 0.8, 0x1f2937, 0.2, 0.12);
scene.add(negZ);

// Visual reference grids
const xyGridGeo = new THREE.PlaneGeometry(8, 8, 8, 8);
const xyGridMat = new THREE.MeshBasicMaterial({ color: 0x1f2937, wireframe: true, transparent: true, opacity: 0.15 });
const xyPlane = new THREE.Mesh(xyGridGeo, xyGridMat);
scene.add(xyPlane);

// Transverse Polarization screen reticle at z=0
const reticleGroup = new THREE.Group();
const circleColors = [0x1e293b, 0x334155, 0x00c8ff];
const radii = [0.5, 1.0, 1.5];
radii.forEach((r, idx) => {
  const pts = [];
  for (let i = 0; i <= 64; i++) {
    const angle = (i / 64) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(angle) * r, Math.sin(angle) * r, 0));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ 
    color: idx === 2 ? 0x00c8ff : 0x1f2937, 
    transparent: true, 
    opacity: idx === 2 ? 0.35 : 0.6 
  });
  const ring = new THREE.Line(geo, mat);
  reticleGroup.add(ring);
});
scene.add(reticleGroup);

// ── EM Vector Arrow Array Setup ───────────────────────────────────────────────
const arrowsE = [], arrowsB = [];
const originOffset = new THREE.Vector3();

for (let i = 0; i < N_ARROWS; i++) {
  const z = -Z_RANGE/2 + (i / (N_ARROWS - 1)) * Z_RANGE;
  originOffset.set(0, 0, z);

  // Electric field vectors (Pink)
  const arrE = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), originOffset, 1, 0xff4d8f, 0.16, 0.09);
  arrE.userData = { z: z };
  scene.add(arrE);
  arrowsE.push(arrE);

  // Magnetic field vectors (Green)
  const arrB = new THREE.ArrowHelper(new THREE.Vector3(0,1,0), originOffset, 1, 0x7fff6e, 0.16, 0.09);
  arrB.userData = { z: z };
  scene.add(arrB);
  arrowsB.push(arrB);
}

// ── Continuous 3D Wave Envelope Curves ────────────────────────────────────────
const ENV_STEPS = 120;
const pointsE = [], pointsB = [];
for (let i = 0; i < ENV_STEPS; i++) {
  pointsE.push(new THREE.Vector3());
  pointsB.push(new THREE.Vector3());
}
const envGeoE = new THREE.BufferGeometry().setFromPoints(pointsE);
const envGeoB = new THREE.BufferGeometry().setFromPoints(pointsB);

const envMatE = new THREE.LineBasicMaterial({ color: 0xff4d8f, linewidth: 2, transparent: true, opacity: 0.75 });
const envMatB = new THREE.LineBasicMaterial({ color: 0x7fff6e, linewidth: 1.5, transparent: true, opacity: 0.6 });

const envLineE = new THREE.Line(envGeoE, envMatE);
const envLineB = new THREE.Line(envGeoB, envMatB);
scene.add(envLineE, envLineB);

// ── Perfect Analytical Polarization Trail at Transverse Plane (z=0) ───────────
const TRAIL_PTS_COUNT = 72;
const analyticalPoints = [];
for (let i = 0; i <= TRAIL_PTS_COUNT; i++) {
  analyticalPoints.push(new THREE.Vector3());
}
const trailGeo = new THREE.BufferGeometry().setFromPoints(analyticalPoints);
const trailMat = new THREE.LineBasicMaterial({ color: 0xc97fff, linewidth: 2.5 });
const trailLine = new THREE.Line(trailGeo, trailMat);
scene.add(trailLine);

// ── Mathematical Physics Core Solvers ─────────────────────────────────────────
function getEAt(z, time) {
  const phase = z - time; // wave propagating along +z
  const Ex = E0x * Math.cos(phase);
  const Ey = E0y * Math.cos(phase + deltaVal);
  return { Ex, Ey };
}

function updateSimulation() {
  // Update Arrows along the Propagation Grid
  for (let i = 0; i < N_ARROWS; i++) {
    const z = arrowsE[i].userData.z;
    const { Ex, Ey } = getEAt(z, t);
    const mag = Math.sqrt(Ex*Ex + Ey*Ey);

    // E-field Vector
    if (showE && mag > 0.001) {
      arrowsE[i].visible = true;
      arrowsE[i].setDirection(new THREE.Vector3(Ex, Ey, 0).normalize());
      arrowsE[i].setLength(mag, Math.min(mag*0.2, 0.18), Math.min(mag*0.1, 0.08));
    } else {
      arrowsE[i].visible = false;
    }

    // B-field Vector: B = (k̂ × E)/c = (-Ey, Ex, 0)
    if (showB && mag > 0.001) {
      arrowsB[i].visible = true;
      // Normalizing B to match relative scaling for visualization
      arrowsB[i].setDirection(new THREE.Vector3(-Ey, Ex, 0).normalize());
      arrowsB[i].setLength(mag, Math.min(mag*0.2, 0.18), Math.min(mag*0.1, 0.08));
    } else {
      arrowsB[i].visible = false;
    }
  }

  // Update 3D Wave Envelope curves
  if (showEnvelope) {
    envLineE.visible = showE;
    envLineB.visible = showB;

    const arrPosE = envGeoE.attributes.position.array;
    const arrPosB = envGeoB.attributes.position.array;

    for (let i = 0; i < ENV_STEPS; i++) {
      const z = -Z_RANGE/2 + (i / (ENV_STEPS - 1)) * Z_RANGE;
      const { Ex, Ey } = getEAt(z, t);

      const eIdx = i * 3;
      arrPosE[eIdx] = Ex;
      arrPosE[eIdx+1] = Ey;
      arrPosE[eIdx+2] = z;

      arrPosB[eIdx] = -Ey;
      arrPosB[eIdx+1] = Ex;
      arrPosB[eIdx+2] = z;
    }
    envGeoE.attributes.position.needsUpdate = true;
    envGeoB.attributes.position.needsUpdate = true;
  } else {
    envLineE.visible = false;
    envLineB.visible = false;
  }

  // Update Dynamic Analytical Polarization Path (Locus at z=0)
  if (showTrail) {
    trailLine.visible = true;
    const pathArr = trailGeo.attributes.position.array;
    for (let i = 0; i <= TRAIL_PTS_COUNT; i++) {
      const theta = (i / TRAIL_PTS_COUNT) * Math.PI * 2;
      const x = E0x * Math.cos(theta);
      const y = E0y * Math.cos(theta + deltaVal);

      const pIdx = i * 3;
      pathArr[pIdx] = x;
      pathArr[pIdx+1] = y;
      pathArr[pIdx+2] = 0; // Exactly on z=0 plane
    }
    trailGeo.attributes.position.needsUpdate = true;
  } else {
    trailLine.visible = false;
  }
}

// ── Interactive UI Logic & State Updaters ─────────────────────────────────────
function updateUIVals() {
  document.getElementById('val-e0x').textContent = E0x.toFixed(2);
  document.getElementById('val-e0y').textContent = E0y.toFixed(2);
  
  const deltaDeg = Math.round((deltaVal * 180) / Math.PI);
  document.getElementById('val-delta').textContent = deltaDeg + '°';

  // Update Sliders to match current variables
  document.getElementById('slide-e0x').value = E0x;
  document.getElementById('slide-e0y').value = E0y;
  document.getElementById('slide-delta').value = deltaDeg;

  // Identify Mode for HUD and update colors dynamically
  let modeName = "Eliptik";
  let modeColor = "#c97fff"; // Purple for elliptic

  if (Math.abs(deltaVal) < 0.01 || Math.abs(Math.abs(deltaVal) - Math.PI) < 0.01) {
    modeName = "Lineer";
    modeColor = "#ff4d8f"; // Pink for linear
  } else if (Math.abs(E0x - E0y) < 0.001 && Math.abs(Math.abs(deltaVal) - Math.PI/2) < 0.01) {
    modeName = "Dairesel";
    modeColor = "#00c8ff"; // Blue for circular
  }

  const hud = document.getElementById('hud-mode-name');
  hud.textContent = modeName;
  hud.style.color = modeColor;
  trailMat.color.setHex(parseInt(modeColor.replace('#', '0x')));

  updateLaTeX();
}

function updateLaTeX() {
  if (typeof katex === 'undefined') return;

  const deltaDeg = Math.round((deltaVal * 180) / Math.PI);
  const phaseSign = deltaDeg >= 0 ? '+' : '';
  const phaseTerm = deltaDeg === 0 ? '' : `${phaseSign}${Math.abs(deltaDeg)}^\\circ`;

  // General E dynamic formulation
  const latexGeneral = `\\mathbf{E}(z,t) = E_{0x}\\cos(kz-\\omega t)\\hat{\\mathbf{x}} + E_{0y}\\cos(kz-\\omega t + \\delta)\\hat{\\mathbf{y}}`;
  katex.render(latexGeneral, document.getElementById('eq-general'));

  // Live dynamic values
  const latexVals = `E_{0x} = ${E0x.toFixed(2)}, \\quad E_{0y} = ${E0y.toFixed(2)}, \\quad \\delta = ${deltaDeg}^\\circ`;
  document.getElementById('eq-values').innerHTML = `<span class="text-xs">` + katex.renderToString(latexVals) + `</span>`;

  // B derivation from Maxwell relation
  const latexMag = `\\mathbf{B}(z,t) = \\frac{1}{c}(\\hat{\\mathbf{z}}\\times\\mathbf{E}) = \\frac{1}{c}(-E_y\\hat{\\mathbf{x}} + E_x\\hat{\\mathbf{y}})`;
  katex.render(latexMag, document.getElementById('eq-magnetic'));
}

// Preset setup triggers
document.getElementById('btn-linear').addEventListener('click', () => {
  E0x = 1.0; E0y = 1.0; deltaVal = 0;
  updateUIVals();
});

document.getElementById('btn-circular').addEventListener('click', () => {
  E0x = 1.0; E0y = 1.0; deltaVal = Math.PI / 2;
  updateUIVals();
});

document.getElementById('btn-elliptic').addEventListener('click', () => {
  E0x = 1.1; E0y = 0.6; deltaVal = Math.PI / 4; // 45 degrees
  updateUIVals();
});

// Real-time slider listeners
document.getElementById('slide-e0x').addEventListener('input', (e) => {
  E0x = parseFloat(e.target.value);
  updateUIVals();
});
document.getElementById('slide-e0y').addEventListener('input', (e) => {
  E0y = parseFloat(e.target.value);
  updateUIVals();
});
document.getElementById('slide-delta').addEventListener('input', (e) => {
  deltaVal = (parseFloat(e.target.value) * Math.PI) / 180;
  updateUIVals();
});

// Toggle handlers
document.getElementById('toggle-E').addEventListener('change', (e) => { showE = e.target.checked; });
document.getElementById('toggle-B').addEventListener('change', (e) => { showB = e.target.checked; });
document.getElementById('toggle-trail').addEventListener('change', (e) => { showTrail = e.target.checked; });
document.getElementById('toggle-envelope').addEventListener('change', (e) => { showEnvelope = e.target.checked; });

// Camera viewpoint presets
document.getElementById('cam-3d').addEventListener('click', () => {
  camera.position.set(7, 4, 12);
  controls.target.set(0, 0, 0);
  controls._updateSpherical();
});
document.getElementById('cam-xy').addEventListener('click', () => {
  camera.position.set(0, 0, 13);
  controls.target.set(0, 0, 0);
  controls._updateSpherical();
});
document.getElementById('cam-xz').addEventListener('click', () => {
  camera.position.set(0, 13, 0.01); // offset slightly on Z axis to prevent gimbal lock
  controls.target.set(0, 0, 0);
  controls._updateSpherical();
});
document.getElementById('cam-yz').addEventListener('click', () => {
  camera.position.set(13, 0, 0);
  controls.target.set(0, 0, 0);
  controls._updateSpherical();
});

// Speed slider and Play/Pause control
const btnPlayPause = document.getElementById('btn-play-pause');
btnPlayPause.addEventListener('click', () => {
  isPlaying = !isPlaying;
  btnPlayPause.textContent = isPlaying ? "Durdur" : "Başlat";
  btnPlayPause.classList.toggle('bg-cyan-500/20');
  btnPlayPause.classList.toggle('bg-rose-500/20');
  btnPlayPause.classList.toggle('text-cyan-300');
  btnPlayPause.classList.toggle('text-rose-300');
  btnPlayPause.classList.toggle('border-cyan-500/40');
  btnPlayPause.classList.toggle('border-rose-500/40');
});

const speedSlider = document.getElementById('speed-slider');
const speedVal = document.getElementById('speed-val');
speedSlider.addEventListener('input', () => {
  speedMult = parseFloat(speedSlider.value);
  speedVal.textContent = 'x' + speedMult.toFixed(1);
});

// Collapsible Panel Logic
const leftPanel = document.getElementById('left-panel');
const togglePanelBtn = document.getElementById('toggle-panel-btn');
togglePanelBtn.addEventListener('click', () => {
  leftPanel.classList.toggle('collapsed');
});

// ── Render & Animation Loop ──────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  if (isPlaying) {
    const dt = clock.getDelta();
    // ω = 3.0 for readable speed, scaled with user multiplier
    t += dt * 3.0 * speedMult;
  } else {
    clock.getDelta(); // keep clock ticking internally without advancing simulation time
  }

  updateSimulation();
  controls.update();
  renderer.render(scene, camera);
}

// Handle window resizing safely
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Initialize simulation state
window.onload = () => {
  updateUIVals();
  animate();
};
</script>
